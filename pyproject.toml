[build-system]
requires = ["setuptools>=40.8"]
build-backend = "setuptools.build_meta"

[project]
name = "swmf-vr"
version = "0.1.0"
description = "Radiation-belt field-line shells for VR"
readme = "README.md"
requires-python = ">=3.6"
authors = [{ name = "Connor DiMarco", email = "cdimarco@umich.edu" }]
dependencies = ["numpy>=1.19", "scipy", "geopack", "matplotlib"]
# ParaView isn't pip-installable; tracing uses its bundled pvbatch. Nothing needs
# installing -- env.sh puts src/ on the path. Scripts in scripts/ run directly.

[tool.setuptools.packages.find]
where = ["src"]
